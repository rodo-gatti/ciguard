[package]
name = "ciguard"
version = "0.1.0"
edition = "2024"
description = "Audit GitHub Actions workflows for security and CI-cost issues"
license = "MIT"
repository = "https://github.com/rodo-gatti/ciguard"
readme = "README.md"
keywords = ["github-actions", "security", "ci", "linter", "sarif"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
toml = "1.2.1"
ureq = { version = "2", features = ["json", "native-certs"] }
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
