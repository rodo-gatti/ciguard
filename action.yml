name: ciguard
description: Audit GitHub Actions workflows for security and CI-cost issues
inputs:
  fail-on:
    description: Minimum severity that fails the step (low, medium, high)
    default: high
runs:
  using: composite
  steps:
    - name: Install ciguard
      shell: bash
      run: cargo install --locked --git https://github.com/rodo-gatti/ciguard --root "$RUNNER_TEMP/ag"
    - name: Generate SARIF
      shell: bash
      run: '"$RUNNER_TEMP/ag/bin/ciguard" . --format sarif --fail-on high > ciguard.sarif || true'
    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
      with:
        sarif_file: ciguard.sarif
    - name: Gate
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
      run: '"$RUNNER_TEMP/ag/bin/ciguard" . --fail-on "$FAIL_ON"'
